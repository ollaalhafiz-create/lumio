name: lumio
description: "Lumio - an Arabic-first interactive study app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.7+1
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf