# This machine has 2.7 GB of RAM and no swap, so the Flutter template defaults
# (-Xmx8G plus a 4 GB metaspace) cannot start. The values below are the largest
# that still leave room for the OS, the ADB server and the Dart frontend.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx640m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:-TieredCompilation
